# dotstar fork only — publishes the patched datasonnet-mapper build to the private
# dotstar-io GitHub Packages registry (com.datasonnet:datasonnet-mapper:<pom version>).
# Upstream keeps its own Maven Central release workflow; this file is fork-specific and
# is NOT part of the upstream PR.
name: Publish (dotstar fork)

on:
  push:
    branches: [feature/dotstar-private-publish]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to dotstar GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'        # source does not compile on JDK 22+ (Ordering.max conflict)
          distribution: 'temurin'
          cache: maven
          server-id: github         # maps the <id>github</id> distributionManagement repo to GITHUB_TOKEN

      - name: Build, test, and deploy
        # license.skip: upstream's license-header check is irrelevant for a private republish
        run: mvn -B -ntp deploy -Dlicense.skip=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
